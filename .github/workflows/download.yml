name: Download from Commit
on:
  push:
    branches:
      - "**"

jobs:
  save-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aria2
        run: sudo apt-get install -y aria2 zip

      - name: Download files
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"

          # استخراج لینک از پیام
          if echo "$MSG" | grep -q "download:"; then
            URLS=$(echo "$MSG" | sed 's/.*download://')
          elif echo "$MSG" | grep -q "download-zip:"; then
            URLS=$(echo "$MSG" | sed 's/.*download-zip://')
          else
            echo "No download command found"
            exit 1
          fi

          mkdir -p downloads

          # دانلود هر لینک
          for URL in $URLS; do
            # حذف کاراکترهای اضافی
            URL=$(echo "$URL" | tr -d '>')
            
            # گرفتن نام فایل
            FILENAME=$(basename "$URL")
            
            echo "Downloading: $URL"
            
            # دانلود با wget (ساده‌تر و مطمئن‌تر)
            wget -O "downloads/$FILENAME" "$URL" || curl -L -o "downloads/$FILENAME" "$URL"
          done

      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add downloads/
          git commit -m "Add downloaded files [skip ci]" || echo "Nothing to commit"
          git push
